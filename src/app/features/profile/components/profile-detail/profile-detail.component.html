<div class="container py-5">
  @if (user) {
    <div class="card shadow border-0 rounded-4 overflow-hidden">
      <!-- Profile Header -->
      <div class="bg-light text-dark text-center p-4">
        <img
          [src]="user.avatar"
          [alt]="user.name"
          class="rounded-circle profile-avatar border border-4 border-white shadow"
        />

        <h3 class="mt-3 mb-1">
          {{ user.name }}
        </h3>

        <span
          class="badge rounded-pill px-3 py-2"
          [class.bg-danger]="isAdmin"
          [class.bg-primary]="!isAdmin"
        >
          {{ user.role }}
        </span>
      </div>

      <!-- Profile Information -->
      <div class="card-body p-4">
        <h5 class="mb-4">Profile Information</h5>

        <div class="row g-4">
          <div class="col-md-6">
            <div class="bg-light rounded-3 p-3">
              <small class="text-muted"> Name </small>

              <p class="mb-0 fw-semibold">
                {{ user.name }}
              </p>
            </div>
          </div>

          <div class="col-md-6">
            <div class="bg-light rounded-3 p-3">
              <small class="text-muted"> Email </small>

              <p class="mb-0 fw-semibold">
                {{ user.email }}
              </p>
            </div>
          </div>

          <div class="col-md-6">
            <div class="bg-light rounded-3 p-3">
              <small class="text-muted"> Account Type </small>

              <p class="mb-0 fw-semibold text-capitalize">
                {{ user.role }}
              </p>
            </div>
          </div>

          <div class="col-md-6">
            <div class="bg-light rounded-3 p-3">
              <small class="text-muted"> User ID </small>

              <p class="mb-0 fw-semibold">#{{ user.id }}</p>
            </div>
          </div>
        </div>

        @if (isAdmin) {
          <div class="alert alert-warning mt-4 mb-0">
            <strong>Administrator account:</strong>
            This user has administrative permissions.
          </div>
        }

        <div class="text-end mt-4">
          <button class="btn btn-primary px-4" [routerLink]="['./edit']">Edit Profile</button>
        </div>
      </div>
    </div>
  }
</div>
